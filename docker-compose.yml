services:
  db:
    image: postgres:17-alpine
    container_name: tsa_db
    env_file: 
      - .env
    restart: unless-stopped
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api:1.0
    container_name: tsa_backend
    env_file: 
      - .env
    restart: unless-stopped
    networks:
      - tsa-network
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    volumes:
      - media_data:/app/src/mediafiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:

networks:
  tsa-network:
    driver: bridge
